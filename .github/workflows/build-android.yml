name: Build Android (APK)

# Gera o APK do Android nos servidores do GitHub (que já têm o SDK do Android) a cada atualização do jogo no main.
# O APK fica:
#   - na página de Releases, na versão "android-latest" (para baixar direto no celular);
#   - no branch "apk-latest" (só o arquivo do APK, sempre substituído pelo mais novo).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'android/**', 'package.json', 'index.html', 'style.css', 'fonts/**', 'icons/**', 'vendor/**', 'capacitor.config.*', 'scripts/**', '.github/workflows/build-android.yml']

permissions:
  contents: write

concurrency:
  group: build-android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - name: Gerar o APK
        run: npm run build:android
      - name: Nome do APK
        id: apk
        run: |
          APK=$(ls dist/Jerrys-Way-*.apk | head -1)
          BUILD=$(grep -o 'versionCode [0-9]*' android/app/build.gradle | grep -o '[0-9]*')
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          ls -la dist/*.apk
      # cópia extra do APK; se a cota de artefatos do GitHub encher, não impede a Release nem o branch apk-latest
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with: { name: Jerrys-Way-Android-APK, path: dist/Jerrys-Way-*.apk, retention-days: 30 }
      - name: Publicar na página de Releases (android-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --cleanup-tag --yes || true
          gh release create android-latest "${{ steps.apk.outputs.path }}" --target "$GITHUB_SHA" \
            --title "Jerry's Way — Android (versão ${{ steps.apk.outputs.build }})" \
            --notes "APK do Android gerado do commit ${GITHUB_SHA::7} (versão ${{ steps.apk.outputs.build }}). Baixe no celular e instale (permita instalar de fontes desconhecidas)."
      - name: Guardar no branch apk-latest
        run: |
          mkdir /tmp/apk && cp "${{ steps.apk.outputs.path }}" /tmp/apk/Jerrys-Way.apk
          cd /tmp/apk
          echo "Versão ${{ steps.apk.outputs.build }} — commit ${GITHUB_SHA}" > VERSAO.txt
          git init -q -b apk-latest
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "APK da versão ${{ steps.apk.outputs.build }} (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk-latest
