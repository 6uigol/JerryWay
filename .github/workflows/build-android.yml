name: Build Android (APK)

# Gera o APK do Android nos servidores do GitHub (que já têm o SDK do Android) a cada atualização do jogo no main.
# O APK fica no branch "richard-apk-latest" (só o arquivo do APK, sempre substituído pelo mais novo).
on:
  workflow_dispatch:
  push:
    branches: [main, richard-is-bored]

permissions:
  contents: write

concurrency:
  group: build-android-richard
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - name: Gerar o APK
        run: npm run build:android
      - name: Nome do APK
        id: apk
        run: |
          APK=$(ls dist/Richard-Is-Bored-*.apk | head -1)
          BUILD=$(grep -o 'versionCode [0-9]*' android/app/build.gradle | grep -o '[0-9]*')
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          ls -la dist/*.apk
      # cópia extra do APK; se a cota de artefatos do GitHub encher, não impede o branch richard-apk-latest
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with: { name: Richard-Is-Bored-Android-APK, path: dist/Richard-Is-Bored-*.apk, retention-days: 30 }
      - name: Guardar no branch richard-apk-latest
        run: |
          mkdir /tmp/apk && cp "${{ steps.apk.outputs.path }}" /tmp/apk/Richard-Is-Bored.apk
          cd /tmp/apk
          echo "Versão ${{ steps.apk.outputs.build }} — commit ${GITHUB_SHA}" > VERSAO.txt
          git init -q -b richard-apk-latest
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "APK da versão ${{ steps.apk.outputs.build }} (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" richard-apk-latest
