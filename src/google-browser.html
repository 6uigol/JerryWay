<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Entrar no Jerry Way</title>
  <link rel="icon" href="/icons/icon-32.png" type="image/png">
  <style>
    body{font:18px/1.6 system-ui,sans-serif;background:#0b0820;color:#fff;margin:0;padding:12vh 22px;text-align:center}
    main{max-width:440px;margin:auto}p{color:#d6cfe6}button,a{font:inherit;display:inline-block;box-sizing:border-box;max-width:100%;padding:14px 24px;border:0;border-radius:8px;background:#e0c060;color:#1a1030;text-decoration:none;white-space:normal;overflow-wrap:anywhere}button{cursor:pointer}button:disabled{opacity:.6}[hidden]{display:none!important}
  </style>
</head>
<body><main>
  <h1>Jerry Way</h1>
  <p id="message" role="status" aria-live="polite">Preparando o acesso…</p>
  <button id="google" type="button" disabled>Entrar com o Google</button>
  <a id="return" hidden>Voltar ao jogo</a>
</main><script type="module" src="/src/google-browser.js"></script></body>
</html>
